<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>劉怡芬教授論文樹</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2317140f'/%3E%3Cg transform='translate(50 54) scale(1.15) translate(-50 -54)'%3E%3Cg stroke='%23e2a07a' stroke-width='3.2' stroke-linecap='round' fill='none'%3E%3Cpath d='M50 80V60M50 60L34 45M50 60L66 45M34 45L25 28M34 45L43 28M66 45L57 28M66 45L75 28'/%3E%3C/g%3E%3Cg fill='%2317140f' stroke='%23e2a07a' stroke-width='3.2'%3E%3Ccircle cx='50' cy='80' r='5'/%3E%3Ccircle cx='50' cy='60' r='4.2'/%3E%3Ccircle cx='34' cy='45' r='4.2'/%3E%3Ccircle cx='66' cy='45' r='4.2'/%3E%3Ccircle cx='25' cy='28' r='4.2'/%3E%3Ccircle cx='43' cy='28' r='4.2'/%3E%3Ccircle cx='57' cy='28' r='4.2'/%3E%3C/g%3E%3Ccircle cx='75' cy='28' r='5.6' fill='%23f0b450'/%3E%3C/g%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f7f3ea" media="(prefers-color-scheme: light)">

<meta name="description" content="逢甲大學資訊工程學系劉怡芬副教授的論文樹學習路徑：由資工大學部基礎一路接到她最新論文與實驗室目前方向，可展開收合、勾選完成、進度存在瀏覽器。">
<script>try { const p = localStorage.getItem('paper-tree-palette'); if (p) document.documentElement.dataset.palette = p; } catch(e){}</script>
<link rel="stylesheet" href="vendor/fonts/newsreader.css">
<link rel="stylesheet" href="styles.css">
<link rel="preload" href="tree.data.js" as="script">
</head>
<body>

<div class="layout">
  <main>
    <header class="top">
      <div class="titlerow">
        <h1 id="title">劉怡芬教授論文樹學習路徑</h1>
        <div class="palettes" id="palettes" role="radiogroup" aria-label="配色">
          <button role="radio" data-p="auto" title="自動（跟系統深淺色）" aria-label="自動" style="--sw-bg:#f7f3ea"></button>
          <button role="radio" data-p="paper" title="紙本" aria-label="紙本" style="--sw-bg:#f7f3ea;--sw-ac:#8a3b1e"></button>
          <button role="radio" data-p="night" title="夜讀" aria-label="夜讀" style="--sw-bg:#17140f;--sw-ac:#e2a07a"></button>
          <button role="radio" data-p="graphite" title="石墨" aria-label="石墨" style="--sw-bg:#f1f2f0;--sw-ac:#b3301c"></button>
          <button role="radio" data-p="mono" title="白紙" aria-label="白紙" style="--sw-bg:#ffffff;--sw-ac:#111111"></button>
          <button role="radio" data-p="navy" title="藍夜" aria-label="藍夜" style="--sw-bg:#0e141c;--sw-ac:#f0b450"></button>
        </div>
      </div>
      <div class="overall">
        <div class="bar"><i id="overallBar"></i></div>
        <strong id="overallText">0%</strong>
        <span id="hoursText"></span>
      </div>
      <button class="nextbtn" id="openNext">下一步</button>
      <div class="sub" id="subtitle">逢甲大學 資訊電機學院 資訊工程學系 · <a href="https://iecs.fcu.edu.tw/teacher/劉怡芬" target="_blank" rel="noopener">官方教師頁</a> · 查詢日 2026-10-21</div>
    </header>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="tree">樹狀檢視</button>
      <button role="tab" aria-selected="false" data-tab="graph">圖形檢視</button>
      <button role="tab" aria-selected="false" data-tab="talk" id="talkTabBtn" hidden>報告準備</button>
      <button role="tab" aria-selected="false" data-tab="preread">五篇優先預讀</button>
      <button role="tab" aria-selected="false" data-tab="order">閱讀順序</button>
      <button role="tab" aria-selected="false" data-tab="selfcheck">自我檢測</button>
      <button role="tab" aria-selected="false" data-tab="glossary">術語與數學</button>
      <button role="tab" aria-selected="false" data-tab="worksheets">學習單</button>
      <button role="tab" aria-selected="false" data-tab="lab">實驗室</button>
      <button role="tab" aria-selected="false" data-tab="sources">來源</button>
    </div>

    <section id="tab-tree">
      <div class="toolbar">
        <input type="search" id="q" placeholder="搜尋標題、作者、關鍵概念" aria-label="搜尋節點">
        <select id="priFilter" aria-label="優先度篩選">
          <option value="all">全部優先度</option>
          <option value="core">必讀</option>
          <option value="corerec">必讀＋建議</option>
        </select>
        <select id="layerFilter" aria-label="層級篩選">
          <option value="all">全部層級</option>
          <option value="0">第 0 層</option><option value="1">第 1 層</option><option value="2">第 2 層</option><option value="3">第 3 層</option><option value="4">第 4 層</option>
        </select>
        <details class="menu"><summary id="moreSum">更多篩選</summary><div class="pop">
          <label><input type="checkbox" id="hideDone"> 隱藏已完成</label>
          <label><input type="checkbox" id="citedOnly"> 她引用過的</label>
          <label><input type="checkbox" id="seniorOnly"> 學長讀過的</label>
        </div></details>
        <button id="toggleAll">全部收合</button>
        <details class="menu"><summary>進度</summary><div class="pop">
          <button id="exportBtn" title="下載 JSON，並複製分享網址">匯出進度</button>
          <button id="importBtn" title="讀取匯出的 JSON 檔">匯入進度</button>
          <button id="resetBtn">清除所有勾選</button>
        </div></details>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
      <div id="tree"></div>
    </section>

    <section id="tab-graph" hidden>
      <div class="toolbar">
        <span id="gBranches"></span>
        <label><input type="checkbox" id="gCore"> 必讀＋建議</label>
        <label><input type="checkbox" id="gCited"> 她引用的連線</label>
        <button id="gFit">置中</button>
        </div>
      <div id="gLegend" class="small"></div>
      <div id="gWrap" title="滾輪縮放、拖曳平移；點節點高亮先修鏈">
        <svg id="gSvg" width="100%" height="100%" style="display:block;cursor:grab" aria-label="論文樹圖形：滾輪縮放、拖曳平移"><g id="gRoot"></g></svg>
        <div id="gTip"></div>
      </div>
    </section>
    <section id="tab-talk" class="talk" hidden></section>
    <section id="tab-preread" hidden></section>
    <section id="tab-order" hidden></section>
    <section id="tab-selfcheck" hidden></section>
    <section id="tab-worksheets" hidden></section>
    <section id="tab-glossary" hidden>
      <div class="toolbar"><input type="search" id="gq" placeholder="搜尋術語（中英文）" aria-label="搜尋術語"></div>
      <div id="glossaryBody"></div>
    </section>
    <section id="tab-lab" hidden></section>
    <section id="tab-sources" hidden></section>
  </main>

  <aside id="aside">
    <button class="asidetoggle" id="asideToggle" aria-expanded="true" aria-controls="detail" aria-label="收合側欄" title="收合側欄"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M5 2l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="closeaside" id="closeAside" aria-label="關閉"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <div id="detail" class="detail"><div class="empty">點選節點查看詳細。</div></div>
  </aside>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const STORAGE_KEY = 'paper-tree-progress-v1';
  let T = window.PAPER_TREE || null;
  let state = { done: {}, collapsed: {}, updatedAt: null };
  let byId = new Map(), dependents = new Map(), order = [];
  let activeId = null;

  function loadState(){
    try { const s = localStorage.getItem(STORAGE_KEY); if (s) state = Object.assign(state, JSON.parse(s)); } catch(e){}
    // 2026-10-30 起分支預設收起：舊版每次載入都把「展開」寫成 false，一次性清掉分支的收合記錄（勾選進度 done 不動）
    if (!state.branchDefaultCollapsed) { for (const k of Object.keys(state.collapsed || {})) if (k.startsWith('b:')) delete state.collapsed[k]; state.branchDefaultCollapsed = true; try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){} }
    // 透過網址 #progress=<base64 JSON> 匯入（用於分享/備份）；可與 &node=<id> 並用
    try {
      const m = location.hash.match(/progress=([A-Za-z0-9+/=_-]+)/);
      if (m) {
        const obj = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));
        if (obj && obj.done) { state.done = obj.done; saveState(); const nm = location.hash.match(/node=([\w-]+)/), tb = location.hash.match(/tab=(\w+)/); history.replaceState(null,'',location.pathname + '#' + [tb ? 'tab=' + tb[1] : '', nm ? 'node=' + nm[1] : ''].filter(Boolean).join('&')); toast('已從網址匯入進度'); }
      }
    } catch(e){}
  }
  function saveState(){ state.updatedAt = new Date().toISOString(); try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){ toast('無法儲存進度（瀏覽器儲存被封鎖）'); } }
  function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 1800); }
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const branchColor = id => `var(--${id})`;

  function init(){
    byId = new Map(T.nodes.map(n => [n.id, n]));
    dependents = new Map();
    for (const n of T.nodes) for (const p of n.prereqs) { if (!dependents.has(p)) dependents.set(p, []); dependents.get(p).push(n.id); }
    order = []; for (const s of T.reading_plan.segments) for (const id of s.nodes) order.push(id);
    document.getElementById('title').textContent = T.title.replace(/（.*?）/, '');
    const p = T.professor;
    document.getElementById('subtitle').innerHTML = `${esc(p.department)} · <a href="${esc(p.official_pages[0].url)}" target="_blank" rel="noopener">官方教師頁</a> · 查詢日 ${esc(T.query_date)}`;
    loadWs(); const wsHash = location.hash.match(/ws=([\w-]+)/); if (wsHash) wsActive = wsHash[1];
    loadTalk(); const tp = (T.talk_plans||[])[0], tb = document.getElementById('talkTabBtn'); if (tp) { tb.textContent = tp.tab_label; tb.hidden = false; }
    renderTree(); updateProgress(); renderNext();
    // 其他分頁等樹狀檢視先畫出來再渲染（縮短首屏）；若網址指定分頁則立刻渲染
    let restDone = false; const renderRest = window.__renderRest = () => { if (restDone) return; restDone = true; renderTalk(); renderOrder(); renderSelfCheck(); renderGlossary(); renderWorksheets(); renderLab(); renderSources(); renderGraphControls(); };
    const tabm = location.hash.match(/tab=(\w+)/); if (tabm) renderRest(); else (window.requestIdleCallback || (fn => setTimeout(fn, 50)))(renderRest);
    if (tabm) { const b = document.querySelector(`.tabs [data-tab="${tabm[1]}"]`); if (b) b.click(); }
    const want = location.hash.match(/node=([\w-]+)/); if (want && byId.has(want[1])) { showDetail(want[1]); if (tabm && tabm[1] === 'graph') { const gl = document.querySelector('#detail [data-graph]'); if (gl) gl.click(); } }
  }

  // ---------- filters ----------
  function passes(n){
    const q = document.getElementById('q').value.trim().toLowerCase();
    const pf = document.getElementById('priFilter').value;
    const lf = document.getElementById('layerFilter').value;
    if (document.getElementById('hideDone').checked && state.done[n.id]) return false;
    if (document.getElementById('citedOnly').checked && !(n.cited_by_her && n.cited_by_her.length)) return false;
    if (document.getElementById('seniorOnly').checked && !(n.read_by && n.read_by.length)) return false;
    if (pf === 'core' && n.priority !== 'core') return false;
    if (pf === 'corerec' && n.priority === 'optional') return false;
    if (lf !== 'all' && String(n.layer) !== lf) return false;
    if (q) { const hay = [n.id, n.title, n.authors.join(' '), n.venue, n.key_concepts.join(' '), n.why].join(' ').toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  }
  function prereqsDone(n){ return n.prereqs.filter(p => !state.done[p]); }

  // ---------- tree ----------
  function renderTree(){
    const root = document.getElementById('tree'); root.innerHTML = '';
    const first = !root.dataset.built; root.dataset.built = '1'; root.classList.toggle('boot', first); if (first) setTimeout(()=> root.classList.remove('boot'), 1400);
    const orderIdx = new Map(order.map((id,i)=>[id,i]));
    // 首次載入只同步畫第一個分支，其餘分支逐格補上（縮短首屏、避免單一長任務）；之後的重畫一次畫完
    const pending = [];
    const buildBranch = (b) => {
      const nodes = T.nodes.filter(n => n.branch === b.id).sort((a,c)=> a.layer-c.layer || (orderIdx.get(a.id)-orderIdx.get(c.id)));
      const visible = nodes.filter(passes);
      if (!visible.length && document.getElementById('q').value) return;
      const det = document.createElement('details'); det.className = 'branch'; det.id = 'br-' + b.id; det.style.setProperty('--bc', branchColor(b.id));
      det.open = state.collapsed['b:'+b.id] === false; // 分支預設收起，展開過的才記為 false
      det.addEventListener('toggle', ()=>{ state.collapsed['b:'+b.id] = !det.open; saveState(); });
      const body = document.createElement('div'); body.className = 'body';
      const doneN = nodes.filter(n=>state.done[n.id]).length;
      const pct = nodes.length ? Math.round(doneN/nodes.length*100) : 0;
      det.innerHTML = `<summary><span class="caret"></span><span class="name">${esc(b.name)}</span>${b.lab_priority?'<span class="lab">實驗室最優先</span>':''}<span class="bprog"><span class="bar"><i style="width:${pct}%"></i></span><span>${doneN}/${nodes.length}</span></span><span class="desc">${esc(b.desc)}</span></summary>`;
      for (const L of T.layers) {
        const ln = visible.filter(n => n.layer === L.id); if (!ln.length) continue;
        const all = nodes.filter(n=>n.layer===L.id);
        const ld = document.createElement('details'); ld.className = 'layer'; const key = 'l:'+b.id+':'+L.id;
        ld.open = !state.collapsed[key];
        ld.dataset.layer = L.id;
        ld.addEventListener('toggle', ()=>{ state.collapsed[key] = !ld.open; saveState(); });
        const ldone = all.filter(n=>state.done[n.id]).length;
        const lhrs = Math.round(all.filter(n=>!state.done[n.id]).reduce((s,n)=>s+n.est_hours,0)*10)/10;
        ld.innerHTML = `<summary><span class="caret"></span>${esc(L.name)} <span class="cnt">${ldone}/${all.length}</span><span class="lh">${lhrs?`· 剩 ${lhrs} h`:''}</span></summary>`;
        const ul = document.createElement('ul'); ul.className = 'nodes';
        for (const n of ln) ul.appendChild(nodeRow(n));
        const lb = document.createElement('div'); lb.className = 'body'; lb.appendChild(ul); ld.appendChild(lb); body.appendChild(ld);
        ld.querySelector(':scope > summary').addEventListener('click', animDetails);
      }
      det.appendChild(body); det.querySelector(':scope > summary').addEventListener('click', animDetails);
      root.appendChild(det);
    };
    for (const b of T.branches) { if (first && root.children.length) pending.push(b); else buildBranch(b); }
    if (pending.length) { const gen = root.dataset.built + ':' + Date.now(); root.dataset.gen = gen; const step = () => { if (root.dataset.gen !== gen || !pending.length) return; buildBranch(pending.shift()); setTimeout(step, 0); }; setTimeout(step, 0); }
    if (!root.children.length && !pending.length) root.innerHTML = '<div class="empty">沒有符合條件的節點。</div>';
    document.getElementById('toggleAll').textContent = allCollapsed() ? '全部展開' : '全部收合';
    const nf = ['hideDone','citedOnly','seniorOnly'].filter(id => document.getElementById(id).checked).length;
    document.getElementById('moreSum').textContent = nf ? `更多篩選（${nf}）` : '更多篩選';
  }
  const RM = matchMedia('(prefers-reduced-motion: reduce)');
  const canTween = () => !!window.gsap && !RM.matches && document.visibilityState === 'visible';
  function animDetails(e){
    const det = e.currentTarget.parentElement, body = det.querySelector(':scope > .body');
    if (!body || !canTween()) return;
    e.preventDefault();
    if (det._closing) { det._tw.kill(); det._closing = false; det._tw = gsap.to(body, { height:'auto', opacity:1, duration:.2, ease:'power4.out', clearProps:'height,opacity' }); return; }
    if (det._tw) det._tw.kill();
    if (det.open) {
      det._closing = true;
      det._tw = gsap.to(body, { height:0, opacity:0, duration:.22, ease:'power4.out', onComplete(){ det.open = false; det._closing = false; gsap.set(body, { clearProps:'height,opacity' }); } });
    } else {
      det.open = true;
      det._tw = gsap.from(body, { height:0, opacity:0, duration:.25, ease:'power4.out', clearProps:'height,opacity' });
    }
  }
  // 勾選後只更新受影響的列與計數，不重畫整棵樹（保留勾選圓點的過渡）
  function refreshRows(id){
    const li = document.querySelector('#tree li.node[data-id="' + id + '"]'); if (li) li.classList.toggle('done', !!state.done[id]);
    for (const d of dependents.get(id) || []) { const row = document.querySelector('#tree li.node[data-id="' + d + '"]'); if (row) row.replaceWith(nodeRow(byId.get(d))); }
    refreshCounts();
  }
  function refreshCounts(){
    for (const b of T.branches) {
      const det = document.getElementById('br-' + b.id); if (!det) continue;
      const nodes = T.nodes.filter(n => n.branch === b.id), d = nodes.filter(n => state.done[n.id]).length;
      const bar = det.querySelector(':scope > summary .bar > i'); if (bar) bar.style.width = (nodes.length ? Math.round(d/nodes.length*100) : 0) + '%';
      const ct = det.querySelector(':scope > summary .bprog span:last-child'); if (ct) ct.textContent = d + '/' + nodes.length;
      det.querySelectorAll(':scope > .body > details.layer').forEach(ld => {
        const all = nodes.filter(n => String(n.layer) === ld.dataset.layer), ldone = all.filter(n => state.done[n.id]).length;
        const lhrs = Math.round(all.filter(n => !state.done[n.id]).reduce((s,n) => s + n.est_hours, 0) * 10) / 10;
        ld.querySelector('.cnt').textContent = ldone + '/' + all.length;
        ld.querySelector('.lh').textContent = lhrs ? '· 剩 ' + lhrs + ' h' : '';
      });
    }
  }
  function allCollapsed(){ return T.branches.every(b => state.collapsed['b:'+b.id] !== false); }
  const PRI_TREE = { core:'必讀', recommended:'建議', optional:'選讀' };
  function nodeRow(n){
    const li = document.createElement('li'); li.className = 'node' + (state.done[n.id] ? ' done':'') + (n.id===activeId?' active':''); li.dataset.id = n.id;
    const missing = prereqsDone(n);
    if (missing.length && !state.done[n.id]) li.classList.add('locked');
    li.innerHTML = `<input type="checkbox" ${state.done[n.id]?'checked':''} aria-label="完成 ${esc(n.title)}">
      <div><button class="t">${esc(n.title)}</button>
        <div class="m">${[`${esc(n.authors[0])}${n.authors.length>1?' 等':''} · ${esc(n.year)}`, `<span class="pri ${n.priority}">${PRI_TREE[n.priority]||esc(n.priority)}</span>`, missing.length?`<span class="blocked">先修未完成 ${missing.length}</span>`:'', (n.cited_by_her||[]).length?`被她引用 ${n.cited_by_her.length} 篇`:'', (n.read_by||[]).length?`${esc(n.read_by.map(r=>r.who).join('、'))}讀過`:'', (n.videos||[]).length?`${n.videos.length} 部影片`:''].filter(Boolean).join(' · ')}</div></div>
      <div class="hrs">${n.est_hours} h</div>`;
    li.querySelector('input').addEventListener('change', e => setDone(n.id, e.target.checked));
    li.querySelector('.t').addEventListener('click', () => showDetail(n.id));
    return li;
  }
  function setDone(id, v){ if (v) state.done[id] = true; else delete state.done[id]; saveState(); if (document.getElementById('hideDone').checked) renderTree(); else refreshRows(id); renderTalk(); renderOrder(); updateProgress(); if (G.built) { const g = document.querySelector(`.gnode[data-id="${id}"]`); if (g) { g.classList.toggle('done', !!state.done[id]); const t = g.querySelector('.gid'); if (t) t.textContent = t.textContent.replace(' ✓','') + (state.done[id]?' ✓':''); } } if (activeId) showDetail(activeId, true); else renderNext(); }

  // ---------- next steps (aside empty state) ----------
  function nextNodes(k){
    const seen = new Set(order), seq = order.map(id=>byId.get(id)).filter(Boolean).concat(T.nodes.filter(n=>!seen.has(n.id)));
    return seq.filter(n => !state.done[n.id] && !prereqsDone(n).length).slice(0, k);
  }
  function renderNext(){
    const el = document.getElementById('detail'), list = nextNodes(5);

  function renderSegments(el, segments, html){
    for (const s of segments) {
      const nodes = s.nodes.map(id=>byId.get(id)).filter(Boolean);
      const d = nodes.filter(n=>state.done[n.id]).length, h = nodes.reduce((a,n)=>a+n.est_hours,0);
      html += `<div class="card seg"><h2>段 ${s.order}：${esc(s.name)}</h2><div class="sp"><span class="bar"><i style="width:${nodes.length?Math.round(d/nodes.length*100):0}%"></i></span>${d}/${nodes.length} 完成 · 約 ${h} 小時</div><p class="goal"><strong>目標：</strong>${esc(s.goal)}</p><ul class="nodes" data-seg="${s.order}"></ul></div>`;

  // ---------- talk plan tab ----------
  const TALK_KEY = 'paper-tree-talk-v1';
  let talk = { done:{}, notes:{} };
  function loadTalk(){ try { const s = localStorage.getItem(TALK_KEY); if (s) talk = Object.assign(talk, JSON.parse(s)); } catch(e){} }
  function saveTalk(){ try { localStorage.setItem(TALK_KEY, JSON.stringify(talk)); } catch(e){ toast('無法儲存報告進度（瀏覽器儲存被封鎖）'); } }
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const mdw = s => { const d = new Date(s + 'T00:00:00'); return `${d.getMonth()+1}/${d.getDate()}（${'日一二三四五六'[d.getDay()]}）`; };
  const TALK_KIND = { node:'節點', paper:'論文', slides:'投影片', practice:'練習' };
  // 標「完成節點」的任務：節點已在樹上完成就算完成
  const fromTree = t => !!(t.marks_node && t.node && state.done[t.node]);
  const taskDone = t => !!talk.done[t.id] || fromTree(t);
  const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
  // 自動順延：沒做完的任務照原本順序，從今天起重新排到上台前一天。每天的量＝原計畫那天的小時數；
  // 落後時每天等比例加量，保證全部排得進去、一項都不刪。上台當天的任務固定在當天。
  // 勾選時記下完成日（talk.done[id] = 日期），今天做完的會扣掉今天的量，清單不會越勾越多。
  function scheduleTalk(P, all, today){
    const at = new Map(), scale = { factor: 1, extra: 0 };
    const doneDate = t => typeof talk.done[t.id] === 'string' ? talk.done[t.id] : t.date;
    for (const t of all) if (taskDone(t)) at.set(t.id, doneDate(t));
    const pinned = all.filter(t => !taskDone(t) && t.date === P.talk_date), open = all.filter(t => !taskDone(t) && t.date !== P.talk_date);
    pinned.forEach(t => at.set(t.id, t.date));
    if (today < P.start_date || today >= P.talk_date) { open.forEach(t => at.set(t.id, t.date)); return { at, scale }; }
    const planned = new Map(); for (const t of all) planned.set(t.date, (planned.get(t.date) || 0) + t.hours);
    const days = []; for (let d = today; d < P.talk_date; d = addDays(d, 1)) days.push(d);
    const doneToday = all.filter(t => taskDone(t) && at.get(t.id) === today).reduce((a, t) => a + t.hours, 0);
    const cap = days.map(d => Math.max(0, (planned.get(d) || 0) - (d === today ? doneToday : 0)));
    const need = open.reduce((a, t) => a + t.hours, 0), have = cap.reduce((a, c) => a + c, 0);
    if (need > have && have > 0) { scale.factor = need / have; scale.extra = need - have; }
    // 把每天的量接成一條時間軸，任務依序鋪上去，落在哪一天由任務時數的中點決定（不會全擠到最後一天）
    const ends = []; cap.reduce((a, c, k) => (ends[k] = a + c * scale.factor), 0);
    let pos = 0, i = 0;
    for (const t of open) {
      const mid = pos + t.hours / 2; pos += t.hours;
      while (i < days.length - 1 && ends[i] < mid - 0.01) i++;
      at.set(t.id, days[i]);
    }
    return { at, scale };
  }
  function renderTalk(){
    const el = document.getElementById('tab-talk'), P = (T.talk_plans||[])[0];
    if (!P) { el.innerHTML = ''; return; }
    const today = ymd(new Date());
    const all = P.phases.flatMap(p => p.days.flatMap(d => d.tasks.map(t => Object.assign({ date:d.date }, t))));
    const hrs = list => Math.round(list.reduce((a,t)=>a+t.hours,0)*10)/10;
    const doneN = all.filter(taskDone).length, pct = Math.round(doneN/all.length*100);
    const daysLeft = Math.round((new Date(P.talk_date+'T00:00:00') - new Date(today+'T00:00:00')) / 864e5);
    const nodeIds = [...new Set(all.filter(t=>t.node).map(t=>t.node))], nodesDone = nodeIds.filter(id=>state.done[id]).length;
    const chip = id => { const n = byId.get(id); if (!n) return ''; const s = n.title.replace(/（.*?）$/,''); return `<a class="${state.done[id]?'done':''}" data-go="${esc(id)}" title="${esc(n.title)}">${state.done[id]?'✓ ':''}${esc(s.length>42?s.slice(0,42)+'…':s)}</a>`; };
    const row = (t, lateTag) => { const d = taskDone(t), tree = fromTree(t);

      return `<li class="tk ${d?'done':''}"><input type="checkbox" data-t="${esc(t.id)}" ${d?'checked':''} ${tree?'disabled title="這個節點已在論文樹上勾選完成；要取消請到節點詳細面板"':''} aria-label="完成：${esc(t.text)}"><div><span class="kind">${TALK_KIND[t.kind]||''}</span><span class="tx">${esc(t.text)}</span>${meta?`<div class="m">${meta}</div>`:''}</div><div class="hrs">${t.hours} h</div></li>`; };
    let html = `<div class="card"><h2>${esc(P.title)}</h2>
      <p><a href="${esc(P.paper.url)}" target="_blank" rel="noopener">${esc(P.paper.title)}</a><br><span class="small">${esc(P.paper.authors)}</span></p>

      <div class="sp"><span class="bar"><i style="width:${pct}%"></i></span>任務 ${doneN}/${all.length} · ${hrs(all.filter(taskDone))}/${hrs(all)} 小時 · 用到 ${nodeIds.length} 個樹節點（已完成 ${nodesDone}）</div>
      <p><strong>${daysLeft > 0 ? `距離 ${mdw(P.talk_date)}上台還有 ${daysLeft} 天` : daysLeft === 0 ? '今天上台' : '報告已結束'}</strong></p>
      <p>${esc(P.goal)}</p>
      <details><summary class="small" style="cursor:pointer">假設與用法</summary><p class="small">${esc(P.assumptions)}</p></details></div>`;
    const { at, scale } = scheduleTalk(P, all, today);
    const moved = t => !taskDone(t) && at.get(t.id) !== t.date ? '原訂 ' + mdw(t.date) : '';
    if (today >= P.start_date && today <= P.talk_date) {
      const todays = all.filter(t => at.get(t.id) === today);
      const warn = scale.extra > 0.05 ? `<p class="small late">進度落後約 ${Math.round(scale.extra*10)/10} 小時，已平均分到上台前的每一天：每天比原計畫多約 ${Math.round((scale.factor-1)*100)}%。真的做不完時，先保住論文精讀與排練，節點任務可縮短。</p>` : '';
      html += `<div class="card"><h2>今天 ${mdw(today)} <span class="small">約 ${hrs(todays)} 小時</span></h2>${warn}${todays.length ? `<ul class="tasks">${todays.map(t=>row(t, moved(t))).join('')}</ul>` : '<p class="small">今天沒有排任務。</p>'}</div>`;
    } else if (today < P.start_date) html += `<div class="card"><p class="small">路徑從 ${mdw(P.start_date)} 開始。</p></div>`;
    for (const ph of P.phases) {
      const ids = new Set(ph.days.flatMap(d => d.tasks.map(t => t.id)));
      const ts = all.filter(t => ids.has(t.id)), d = ts.filter(taskDone).length;
      const dates = [...new Set(ts.map(t => at.get(t.id)))].sort();
      html += `<div class="card"><h2>${esc(ph.name)} <span class="small">${mdw(dates[0])}–${mdw(dates[dates.length-1])}</span></h2><div class="sp"><span class="bar"><i style="width:${Math.round(d/ts.length*100)}%"></i></span>${d}/${ts.length} 完成 · 約 ${hrs(ts)} 小時</div><p><strong>目標：</strong>${esc(ph.goal)}</p><p class="small"><strong>產出：</strong>${esc(ph.deliverable)}</p>
        ${dates.map(day => { const dt = ts.filter(t => at.get(t.id) === day); return `<h3 class="${day===today?'today':''}">${mdw(day)}${day===today?' 今天':''} <span class="small">約 ${hrs(dt)} 小時</span></h3><ul class="tasks">${dt.map(t=>row(t, moved(t))).join('')}</ul>`; }).join('')}</div>`;
    }
    html += `<div class="card"><h2>必背數字</h2><table><thead><tr><th style="width:26%">項目</th><th>數字</th><th style="width:14%">出處</th></tr></thead><tbody>${P.numbers.map(x=>`<tr><td>${esc(x.what)}</td><td>${esc(x.value)}</td><td>${esc(x.src)}</td></tr>`).join('')}</tbody></table></div>`;

    html += `<div class="card"><h2>預期問題（${P.qa.length}）</h2>${P.qa.map((q,i)=>`<details class="qa"><summary>${i+1}. ${esc(q.q)}</summary><textarea data-n="qa${i}" placeholder="我的答案">${esc(talk.notes['qa'+i]||'')}</textarea><details class="hint"><summary>提示</summary><p>${esc(q.hint)}</p>${(q.nodes||[]).length?`<p class="small dep">相關節點：${q.nodes.map(chip).join('')}</p>`:''}</details></details>`).join('')}</div>`;
    html += `<div class="card"><h2>我的講稿與筆記</h2>${P.pitch_prompts.map(p=>`<p style="margin-top:18px"><strong>${esc(p.label)}</strong></p><textarea data-n="${esc(p.key)}" placeholder="${esc(p.placeholder||'寫在這裡…')}">${esc(talk.notes[p.key]||'')}</textarea>`).join('')}</div>`;
    // 追加區：不排日期、不算進進度與順延的選讀任務
    const extras = P.extras || [];
    if (extras.length) html += `<div class="card"><h2>追加 <span class="small">${extras.filter(taskDone).length}/${extras.length} 完成 · 約 ${hrs(extras)} 小時</span></h2><p class="small">${esc(P.extras_note||'')}</p><ul class="tasks">${extras.map(t=>row(t,'')).join('')}</ul></div>`;
    const openQa = [...el.querySelectorAll('details.qa')].map(d => d.open);

  // ---------- graph view ----------
  const G = { built:false, pos:new Map(), vb:null, zoom:1, tx:0, ty:0, hidden:new Set(), sel:null };
  const NW = 150, NH = 46, CW = 166, RH = 60, LAYER_GAP = 90, BRANCH_GAP = 40;
  const BR_ORDER = ['found','tone','variation','child','deepfake'];
  function shortTitle(t){ t = String(t).replace(/（.*?）|\(.*?\)/g,'').trim(); return t.length > 40 ? t.slice(0,39) + '…' : t; }
  function wrap2(t){ const a = shortTitle(t); if (a.length <= 21) return [a]; const cut = a.slice(0,21), rest = a.slice(21); return [cut, rest.length > 20 ? rest.slice(0,19)+'…' : rest]; }
  function gVisible(n){ if (G.hidden.has(n.branch)) return false; if (document.getElementById('gCore').checked && n.priority === 'optional') return false; return true; }
  function layoutGraph(){
    const orderIdx = new Map(order.map((id,i)=>[id,i]));
    const vis = T.nodes.filter(gVisible);
    const layers = T.layers.map(l=>l.id).sort((a,b)=>a-b);
    // columns per branch
    const cols = {}; for (const b of BR_ORDER) { let k = 1; for (const L of layers) { const n = vis.filter(x=>x.branch===b && x.layer===L).length; k = Math.max(k, Math.ceil(Math.sqrt(n/2))); } cols[b] = k; }
    const bx = {}; let x = 60; for (const b of BR_ORDER) { if (G.hidden.has(b)) continue; bx[b] = x; x += cols[b]*CW + BRANCH_GAP; }
    const totalW = x;
    // rows: layer 0 at bottom
    G.pos.clear(); const bands = []; let y = 40;
    for (const L of [...layers].reverse()) {
      let rows = 1; const cells = {};
      for (const b of BR_ORDER) { if (G.hidden.has(b)) continue; const ns = vis.filter(n=>n.branch===b && n.layer===L).sort((a,c)=>(orderIdx.get(a.id)-orderIdx.get(c.id))); cells[b] = ns; rows = Math.max(rows, Math.ceil(ns.length/cols[b])); }
      bands.push({ layer:L, y, h: rows*RH + 20 });
      for (const b of BR_ORDER) { if (G.hidden.has(b)) continue; cells[b].forEach((n,i)=>{ const c = i % cols[b], r = Math.floor(i/cols[b]); G.pos.set(n.id, { x: bx[b] + c*CW + NW/2, y: y + 10 + r*RH + NH/2, n }); }); }
      y += rows*RH + 20 + LAYER_GAP;
    }
    // one barycenter pass per row to reduce crossings: reorder within cell by mean x of placed prereqs (lower layers already have positions since we built top-down, so use dependents instead) — keep simple: skip.
    return { totalW, totalH: y, bands, bx, cols };
  }
  function buildGraph(){
    const root = document.getElementById('gRoot'); root.innerHTML = '';
    const { totalW, totalH, bands, bx, cols } = layoutGraph();
    const NS = 'http://www.w3.org/2000/svg';
    const el = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
    for (const b of bands) { root.appendChild(el('rect', { class:'gband', x:0, y:b.y, width:totalW, height:b.h })); const t = el('text', { class:'glayer', x:8, y:b.y - 8 }); t.textContent = T.layers.find(l=>l.id===b.layer).name; root.appendChild(t); }
    for (const b of BR_ORDER) { if (G.hidden.has(b)) continue; const br = T.branches.find(x=>x.id===b); const t = el('text', { class:'gbranch', x: bx[b], y: 22, fill: branchColor(b) }); t.textContent = br.name; root.appendChild(t); }
    const edges = el('g', {}); root.appendChild(edges);
    const showCite = document.getElementById('gCited').checked;
    for (const n of T.nodes) { const to = G.pos.get(n.id); if (!to) continue;
      for (const p of n.prereqs) { const from = G.pos.get(p); if (!from) continue; edges.appendChild(el('path', { class:'gedge', 'data-from':p, 'data-to':n.id, d: curve(from, to) })); }
      if (showCite) for (const c of n.cited_by_her || []) { const to2 = G.pos.get(c); if (!to2) continue; edges.appendChild(el('path', { class:'gedge cite', 'data-from':n.id, 'data-to':c, d: curve(to, to2) })); }
    }
    const nodesG = el('g', {}); root.appendChild(nodesG);
    for (const [id, p] of G.pos) { const n = p.n; const g = el('g', { class:'gnode' + (state.done[id]?' done':''), transform:`translate(${p.x - NW/2},${p.y - NH/2})`, 'data-id':id });
      g.appendChild(el('rect', { width:NW, height:NH, stroke:branchColor(n.branch), 'stroke-dasharray': n.priority==='optional' ? '3 2' : '' }));
      const lines = wrap2(n.title); lines.forEach((ln,i)=>{ const t = el('text', { x:7, y:15 + i*12 }); t.textContent = ln; g.appendChild(t); });
      const idt = el('text', { class:'gid', x:7, y:NH-5 }); idt.textContent = `${id} · ${n.year} · ${n.est_hours}h${state.done[id]?' ✓':''}`; g.appendChild(idt);
      g.addEventListener('click', ()=>{ selectGraphNode(id); showDetail(id); });
      g.addEventListener('mousemove', e=>{ const tip = document.getElementById('gTip'); tip.style.display='block'; tip.textContent = n.title; const r = document.getElementById('gWrap').getBoundingClientRect(); tip.style.left = (e.clientX - r.left + 12) + 'px'; tip.style.top = (e.clientY - r.top + 12) + 'px'; });
      g.addEventListener('mouseleave', ()=>{ document.getElementById('gTip').style.display='none'; });
      nodesG.appendChild(g);
    }
    G.vb = { w: totalW, h: totalH }; G.built = true;
    if (G.sel && G.pos.has(G.sel)) selectGraphNode(G.sel); else G.sel = null;
    fitGraph();
  }
  function curve(a, b){ const y1 = a.y - NH/2, y2 = b.y + NH/2; const m = (y1 + y2)/2; return `M${a.x},${y1} C${a.x},${m} ${b.x},${m} ${b.x},${y2}`; }
  function selectGraphNode(id){
    G.sel = id; const anc = new Set(), des = new Set();
    (function up(i){ for (const p of (byId.get(i)||{}).prereqs||[]) if (!anc.has(p)) { anc.add(p); up(p); } })(id);
    (function down(i){ for (const d of dependents.get(i)||[]) if (!des.has(d)) { des.add(d); down(d); } })(id);
    document.querySelectorAll('.gnode').forEach(g => { const i = g.dataset.id; g.classList.toggle('sel', i===id); g.classList.toggle('dim', !(i===id || anc.has(i) || des.has(i))); });
    document.querySelectorAll('.gedge').forEach(e => { const f = e.dataset.from, t = e.dataset.to; const on = !e.classList.contains('cite') && ((t===id||des.has(t)) && (f===id||anc.has(f)||des.has(f)) || (f===id||anc.has(f)) && (t===id||anc.has(t))); e.classList.toggle('hl', on); e.classList.toggle('dim', !on); });
  }
  function clearGraphSel(){ G.sel = null; document.querySelectorAll('.gnode,.gedge').forEach(e=>{ e.classList.remove('sel','dim','hl'); }); }
  function applyGraphTransform(){ document.getElementById('gRoot').setAttribute('transform', `translate(${G.tx},${G.ty}) scale(${G.zoom})`); }
  function fitGraph(){ const w = document.getElementById('gWrap').clientWidth, h = document.getElementById('gWrap').clientHeight; if (!G.vb) return; G.zoom = Math.min(w / G.vb.w, h / G.vb.h, 1.2) * 0.97; G.tx = (w - G.vb.w*G.zoom)/2; G.ty = (h - G.vb.h*G.zoom)/2; applyGraphTransform(); }
  (function initGraphUI(){
    const svg = document.getElementById('gSvg'); let drag = null;
    svg.addEventListener('wheel', e => { e.preventDefault(); const r = svg.getBoundingClientRect(); const mx = e.clientX - r.left, my = e.clientY - r.top; const f = e.deltaY < 0 ? 1.15 : 1/1.15; const nz = Math.max(0.08, Math.min(3, G.zoom*f)); G.tx = mx - (mx - G.tx) * (nz/G.zoom); G.ty = my - (my - G.ty) * (nz/G.zoom); G.zoom = nz; applyGraphTransform(); }, { passive:false });
    svg.addEventListener('mousedown', e => { drag = { x:e.clientX, y:e.clientY, tx:G.tx, ty:G.ty, moved:false }; svg.style.cursor='grabbing'; });
    window.addEventListener('mousemove', e => { if (!drag) return; const dx = e.clientX-drag.x, dy = e.clientY-drag.y; if (Math.abs(dx)+Math.abs(dy) > 3) drag.moved = true; G.tx = drag.tx + dx; G.ty = drag.ty + dy; applyGraphTransform(); });
    window.addEventListener('mouseup', e => { if (drag && !drag.moved && e.target === svg) clearGraphSel(); drag = null; svg.style.cursor='grab'; });
    svg.addEventListener('touchstart', e => { if (e.touches.length===1) drag = { x:e.touches[0].clientX, y:e.touches[0].clientY, tx:G.tx, ty:G.ty }; }, { passive:true });
    svg.addEventListener('touchmove', e => { if (!drag || e.touches.length!==1) return; G.tx = drag.tx + e.touches[0].clientX-drag.x; G.ty = drag.ty + e.touches[0].clientY-drag.y; applyGraphTransform(); }, { passive:true });
    svg.addEventListener('touchend', ()=> drag = null);
    document.getElementById('gFit').addEventListener('click', fitGraph);
    document.getElementById('gCore').addEventListener('change', buildGraph);
    document.getElementById('gCited').addEventListener('change', buildGraph);
    window.addEventListener('resize', ()=>{ if (G.built && !document.getElementById('tab-graph').hidden) fitGraph(); });
  })();
  function renderGraphControls(){
    const el = document.getElementById('gBranches'); el.innerHTML = '';
    for (const b of T.branches) { const lab = document.createElement('label'); lab.className='small'; lab.style.marginRight='8px'; lab.innerHTML = `<input type="checkbox" checked data-b="${b.id}"> <span style="color:${branchColor(b.id)};font-weight:600">${esc(b.name)}</span>`; lab.querySelector('input').addEventListener('change', e=>{ if (e.target.checked) G.hidden.delete(b.id); else G.hidden.add(b.id); buildGraph(); }); el.appendChild(lab); }
    document.getElementById('gLegend').innerHTML = `<span>實線框 必讀／建議</span><span>虛線框 選讀</span><span style="color:var(--ok)">綠底 已完成</span><span>下方為先修</span><span style="color:var(--warn)">橘虛線 她引用</span>`;
  }

  // ---------- events ----------
  document.querySelectorAll('.tabs [role=tab]').forEach(btn => btn.addEventListener('click', ()=>{
    if (window.__renderRest) window.__renderRest();
    document.querySelectorAll('.tabs [role=tab]').forEach(b=>b.setAttribute('aria-selected', b===btn));
    document.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== 'tab-' + btn.dataset.tab);
    if (btn.dataset.tab === 'graph') { if (!G.built) buildGraph(); else fitGraph(); }
    btn.scrollIntoView({ block:'nearest', inline:'nearest' });
  }));
  // 配色：auto＝不設 data-palette，跟系統深淺色；其他值固定配色並記在這個瀏覽器
  const PALETTE_KEY = 'paper-tree-palette';
  function markPalette(){ const cur = document.documentElement.dataset.palette || 'auto'; document.querySelectorAll('#palettes [data-p]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.p === cur))); }
  function setPalette(p){
    const apply = () => { if (p === 'auto') delete document.documentElement.dataset.palette; else document.documentElement.dataset.palette = p; markPalette(); };
    if (document.startViewTransition && !RM.matches) document.startViewTransition(apply); else apply();
    try { p === 'auto' ? localStorage.removeItem(PALETTE_KEY) : localStorage.setItem(PALETTE_KEY, p); } catch(e){}
  }
  document.querySelectorAll('#palettes [data-p]').forEach(b => b.addEventListener('click', ()=> setPalette(b.dataset.p)));
  markPalette();
  // 桌面版側欄可收合，狀態只存在這個瀏覽器
  const ASIDE_KEY = 'paper-tree-aside-collapsed';
  function setAsideCollapsed(c){
    const lay = document.querySelector('.layout'), btn = document.getElementById('asideToggle');
    lay.classList.toggle('aside-collapsed', c);
    btn.setAttribute('aria-expanded', String(!c)); btn.setAttribute('aria-label', c ? '展開側欄' : '收合側欄'); btn.title = btn.getAttribute('aria-label');
    try { c ? localStorage.setItem(ASIDE_KEY, '1') : localStorage.removeItem(ASIDE_KEY); } catch(e){}
  }
  try { if (localStorage.getItem(ASIDE_KEY)) setAsideCollapsed(true); } catch(e){}
  document.getElementById('asideToggle').addEventListener('click', ()=> setAsideCollapsed(!document.querySelector('.layout').classList.contains('aside-collapsed')));
  document.getElementById('openNext').addEventListener('click', ()=>{ if (activeId) document.getElementById('backNext').click(); else renderNext(); const a = document.getElementById('aside'); a.scrollTop = 0; a.classList.add('open'); });
  ['q','priFilter','layerFilter','hideDone','citedOnly','seniorOnly'].forEach(id => document.getElementById(id).addEventListener('input', renderTree));
  document.getElementById('toggleAll').addEventListener('click', ()=>{ const expand = allCollapsed(); if (expand) state.collapsed = {}; for (const b of T.branches) state.collapsed['b:'+b.id] = !expand; saveState(); renderTree(); });
  document.addEventListener('click', e => { document.querySelectorAll('details.menu[open]').forEach(d => { if (!d.contains(e.target)) d.open = false; }); });
  document.getElementById('resetBtn').addEventListener('click', ()=>{ if (confirm('確定要清除所有勾選進度？')) { state.done = {}; saveState(); renderTree(); renderTalk(); renderOrder(); updateProgress(); if (activeId) showDetail(activeId, true); else renderNext(); } });
  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const data = JSON.stringify({ exported_at: new Date().toISOString(), done: state.done, worksheets: wsState, talk }, null, 2);
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type:'application/json'})); a.download = 'paper-tree-progress.json'; a.click();
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify({done: state.done})))).replace(/\+/g,'-').replace(/\//g,'_');
    try { navigator.clipboard.writeText(location.href.split('#')[0] + '#progress=' + b64); toast('已下載 JSON，並複製可分享的進度網址'); } catch(e){ toast('已下載 JSON'); }
  });
  document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { try { const o = JSON.parse(r.result); if (!o.done) throw 0; state.done = o.done; if (o.worksheets) { wsState = o.worksheets; saveWs(); renderWorksheets(); } if (o.talk) { talk = Object.assign({ done:{}, notes:{} }, o.talk); saveTalk(); } saveState(); renderTree(); renderTalk(); renderOrder(); updateProgress(); if (activeId) showDetail(activeId, true); else renderNext(); toast('已匯入進度'); } catch(err){ toast('檔案格式不正確'); } };
    r.readAsText(f); e.target.value = '';
  });
  document.getElementById('closeAside').addEventListener('click', ()=> document.getElementById('aside').classList.remove('open'));

  // ---------- boot ----------
  function boot(){
    T = T || window.PAPER_TREE || null;
    if (T) { loadState(); init(); return; }
    // tree.data.js 不存在時（例如只有 tree.json），嘗試以 fetch 載入（需透過 http 伺服器開啟）
    fetch('tree.json').then(r=>r.json()).then(j=>{ T = j; loadState(); init(); }).catch(()=>{ document.getElementById('tree').innerHTML = '<div class="empty">找不到 tree.data.js。請先執行 <kbd>node scripts/build-data.js</kbd> 產生資料檔，或以本機 http 伺服器開啟本頁。</div>'; });
  }
  // tree.data.js 已用 preload 先下載；等第一格畫面畫出來（或最多 300ms）再插入執行，首屏不被 360KB 的資料解析擋住
  let dataStarted = false;
  const startData = () => { if (dataStarted) return; dataStarted = true; const sc = document.createElement('script'); sc.src = 'tree.data.js'; sc.onload = boot; sc.onerror = boot; document.head.appendChild(sc); };
  requestAnimationFrame(() => requestAnimationFrame(startData)); setTimeout(startData, 300);
  // GSAP 只負責動效，等頁面載完再載入，不佔首屏頻寬；載入前的展開收合走原生即時切換
  const loadGsap = () => { const sc = document.createElement('script'); sc.src = 'vendor/gsap/gsap.min.js'; document.head.appendChild(sc); };
  if (document.readyState === 'complete') loadGsap(); else window.addEventListener('load', loadGsap);
  // 透過網址開啟時註冊離線快取，讓手機加到主畫面後離線也能開（file:// 開啟時瀏覽器不支援，略過）
  if ('serviceWorker' in navigator && location.protocol !== 'file:') window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
